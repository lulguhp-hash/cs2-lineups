<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS2 Раскидки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#14171c;--card:#1d222a;--text:#e8ebf0;--muted:#8d97a6;--accent:#f0a030;--line:#2a313b}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,sans-serif;padding:12px 12px 40px}
h1{font-size:20px;margin:4px 0 12px}
input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#14171c;font-weight:600}
.card{background:var(--card);border-radius:12px;margin:12px 0;overflow:hidden}
video{width:100%;display:block;background:#000;aspect-ratio:9/16;max-height:70vh}
.info{padding:10px 12px 12px}
.title{font-weight:600}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>
<h1>Раскидки CS2</h1>
<input id="q" type="search" placeholder="Поиск: дым, B, мид…">
<div class="chips" id="maps"></div>
<div class="chips" id="types"></div>
<div id="list"></div>

<script>
// ДОБАВЛЯЙТЕ СВОИ РАСКИДКИ СЮДА. video — прямая ссылка на .mp4
const LINEUPS = [
  {map:"Mirage", type:"Смок", title:"Смок на окно из CT-спавна", desc:"Встать у стены, прицел на угол крыши, ЛКМ.", author:"@ник_автора", video:"https://example.com/video1.mp4"},
  {map:"Mirage", type:"Флеш", title:"Флеш на B-апартаменты", desc:"Бросок с прыжком, ПКМ.", author:"@ник_автора", video:"https://example.com/video2.mp4"},
  {map:"Inferno", type:"Молотов", title:"Молотов на банан", desc:"Из угла у бочек, бросок в стык ящиков.", author:"@ник_автора", video:"https://example.com/video3.mp4"},
  {map:"Dust2", type:"Смок", title:"Смок на дальний центр", desc:"С T-спавна, прицел на вышку.", author:"@ник_автора", video:"https://example.com/video4.mp4"}
];

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const state = {map:"Все", type:"Все", q:""};
const uniq = key => ["Все", ...new Set(LINEUPS.map(l => l[key]))];

function chips(id, key){
  const box = document.getElementById(id);
  box.innerHTML = "";
  uniq(key).forEach(v => {
    const b = document.createElement("button");
    b.className = "chip" + (state[key] === v ? " on" : "");
    b.textContent = v;
    b.onclick = () => { state[key] = v; render(); };
    box.appendChild(b);
  });
}

function render(){
  chips("maps","map"); chips("types","type");
  const q = state.q.toLowerCase();
  const items = LINEUPS.filter(l =>
    (state.map === "Все" || l.map === state.map) &&
    (state.type === "Все" || l.type === state.type) &&
    (l.title + l.desc + l.map + l.type).toLowerCase().includes(q));
  const list = document.getElementById("list");
  list.innerHTML = items.length ? "" : '<div class="empty">Ничего не найдено. Попробуйте другой фильтр.</div>';
  items.forEach(l => {
    const d = document.createElement("div");
    d.className = "card";
    d.innerHTML = `<video src="${l.video}" controls playsinline preload="metadata"></video>
      <div class="info"><div class="title"></div><div class="meta"></div></div>`;
    d.querySelector(".title").textContent = l.title;
    d.querySelector(".meta").textContent = `${l.map}, ${l.type}. ${l.desc} Автор: ${l.author}`;
    list.appendChild(d);
  });
}

document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };
render();
</script>
</body>
</html>
